server:
  port: 8443
  ssl:
    # Self-signed localhost certificate for HTTPS only; the SAML key is in keystore.p12
    enabled: true
    key-store: classpath:tls.p12
    key-store-type: PKCS12
    key-store-password: changeit
    key-alias: localhost

nemlogin:
  entity-id: https://oiosaml.java-spring
  base-url: https://localhost:8443
  idp-metadata: test-devtest4-idp-metadata.xml
  keystore: keystore.p12
  keystore-password: 'dYTEc;Gc1ut:'
  keystore-alias: oiosaml.java sp and wsc
  # None, Low, Substantial or High
  nsis-level: Substantial

logging:
  level:
    org.springframework.security.saml2: DEBUG
    # IntelliJ's idea_rt.jar agent opens a JMX/RMI port bound to 0.0.0.0;
    # it WARNs on every connection it rejects from a non-local peer.
    sun.rmi: ERROR
